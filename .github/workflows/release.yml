name: Release

# Builds, signs, and notarizes the desktop app for Windows, macOS, and Linux on every
# v*.*.* tag, and publishes a draft GitHub Release with all artifacts plus SHA-256
# checksums. Signing/notarization degrade gracefully (unsigned build + warning) until
# the secrets in docs/runbook.md §7.4 are configured. The release is always created as
# a draft — publishing is a manual step (docs/runbook.md §7.5).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & sign (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Windows EV certificate (docs/runbook.md §7.1) ──────────────────────────
      # Uncomment ONE of the following once the corresponding secrets exist. Both
      # install the EV cert into the Windows certificate store; electron-builder then
      # signs via signtoolOptions.certificateSubjectName/certificateSha1 (passed to
      # `pnpm dist` below). Until then this job builds an unsigned .exe.
      #
      # Option A — SSL.com eSigner:
      # - name: Install SSL.com eSignerCKA
      #   if: matrix.platform == 'win'
      #   uses: sslcom/esigner-codesign@develop
      #   with:
      #     command: setup
      #     username: ${{ secrets.ES_USERNAME }}
      #     password: ${{ secrets.ES_PASSWORD }}
      #     credential_id: ${{ secrets.ES_CREDENTIAL_ID }}
      #     totp_secret: ${{ secrets.ES_TOTP_SECRET }}
      #
      # Option B — Azure Trusted Signing:
      # - name: Install Azure Trusted Signing CLI
      #   if: matrix.platform == 'win'
      #   run: dotnet tool install --global sign --version 0.9.1-beta.24617.3

      - name: Build & publish (draft release)
        run: pnpm --filter @cairn/desktop run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (no-ops if unset — docs/runbook.md §7.2)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Generate SHA-256 checksums
        shell: bash
        working-directory: apps/desktop/dist
        run: |
          shopt -s nullglob
          targets=(*.exe *.dmg *.AppImage *.zip)
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::warning::No release artifacts found to checksum"
            exit 0
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${targets[@]}" > "checksums-${{ matrix.platform }}.txt"
          else
            shasum -a 256 "${targets[@]}" > "checksums-${{ matrix.platform }}.txt"
          fi
          cat "checksums-${{ matrix.platform }}.txt"

      - name: Upload checksums to draft release
        shell: bash
        working-directory: apps/desktop/dist
        run: |
          if [ -f "checksums-${{ matrix.platform }}.txt" ]; then
            gh release upload "${{ github.ref_name }}" "checksums-${{ matrix.platform }}.txt" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
