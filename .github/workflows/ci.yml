name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Type-check + lint ───────────────────────────────────────────────────
  typecheck:
    name: Typecheck & Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned (not "latest"): pnpm 11.x dropped Node 20 support (requires the
          # node:sqlite built-in, Node >=22.13) and floating "latest" silently broke
          # every job here (ERR_UNKNOWN_BUILTIN_MODULE at `pnpm install`, every run
          # since at least commit efef4cc). .nvmrc pins Node 20; this pnpm version
          # matches security.yml's already-working pin.
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (renderer + shared)
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Format check (Prettier)
        run: pnpm format:check

  # ── 1b. Dependency audit (high/critical block) ─────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned (not "latest"): pnpm 11.x dropped Node 20 support (requires the
          # node:sqlite built-in, Node >=22.13) and floating "latest" silently broke
          # every job here (ERR_UNKNOWN_BUILTIN_MODULE at `pnpm install`, every run
          # since at least commit efef4cc). .nvmrc pins Node 20; this pnpm version
          # matches security.yml's already-working pin.
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §19.7 — high/critical production advisories block the build.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ── 1c. License gate (no GPL/AGPL transitives) ─────────────────────────────
  licenses:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned (not "latest"): pnpm 11.x dropped Node 20 support (requires the
          # node:sqlite built-in, Node >=22.13) and floating "latest" silently broke
          # every job here (ERR_UNKNOWN_BUILTIN_MODULE at `pnpm install`, every run
          # since at least commit efef4cc). .nvmrc pins Node 20; this pnpm version
          # matches security.yml's already-working pin.
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §19.7 — GPL/AGPL transitives fail CI.
      - name: Check licenses
        run: pnpm check-licenses

  # ── 2. Unit + integration tests ────────────────────────────────────────────
  unit:
    name: Unit Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned (not "latest"): pnpm 11.x dropped Node 20 support (requires the
          # node:sqlite built-in, Node >=22.13) and floating "latest" silently broke
          # every job here (ERR_UNKNOWN_BUILTIN_MODULE at `pnpm install`, every run
          # since at least commit efef4cc). .nvmrc pins Node 20; this pnpm version
          # matches security.yml's already-working pin.
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run unit & integration tests
        run: pnpm test:unit

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  # ── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build (Electron)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned (not "latest"): pnpm 11.x dropped Node 20 support (requires the
          # node:sqlite built-in, Node >=22.13) and floating "latest" silently broke
          # every job here (ERR_UNKNOWN_BUILTIN_MODULE at `pnpm install`, every run
          # since at least commit efef4cc). .nvmrc pins Node 20; this pnpm version
          # matches security.yml's already-working pin.
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upload built output
        uses: actions/upload-artifact@v4
        with:
          name: electron-out
          path: out/
          retention-days: 1

  # ── 4. Smoke E2E ───────────────────────────────────────────────────────────
  smoke-e2e:
    name: Smoke E2E
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned (not "latest"): pnpm 11.x dropped Node 20 support (requires the
          # node:sqlite built-in, Node >=22.13) and floating "latest" silently broke
          # every job here (ERR_UNKNOWN_BUILTIN_MODULE at `pnpm install`, every run
          # since at least commit efef4cc). .nvmrc pins Node 20; this pnpm version
          # matches security.yml's already-working pin.
          version: '10.33.0'

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download built output
        uses: actions/download-artifact@v4
        with:
          name: electron-out
          path: out/

      - name: Install Playwright (no browsers needed — Electron ships its own)
        run: pnpm playwright install --with-deps chromium
        # The `chromium` arg is a no-op for Electron tests but avoids
        # playwright install trying to download every browser.

      - name: Run smoke E2E
        run: pnpm test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test-results/
