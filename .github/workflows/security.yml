name: security

# Production-hardening security gates (CLAUDE.md §2.13, §18.9; threat-model §6 M21/M23).
#
# Secret scanning lives in gitleaks.yml; dependency audit + license gate live in ci.yml.
# This workflow adds the Stage 18.9 security jobs that are too heavy for the inner CI loop:
#   - dep-audit     : pnpm audit --prod (high/critical block)  [task §3]
#   - trivy-fs      : filesystem vuln + secret scan of the repo  [task §3]
#   - trivy-image   : build the API container and scan it        [task §3]
#   - zap-baseline  : OWASP ZAP DAST against the staging API     [task §6]
#
# High/CRITICAL findings fail the job and therefore block merge (branch protection).

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly-disclosed CVEs in pinned deps surface even with no code change.
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write # upload SARIF to the GitHub Security tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dependency audit (production, high/critical block) — task §3 ───────────────────────
  dep-audit:
    name: Dependency Audit (prod, high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.33.0'
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # §19.7 — high/critical production advisories block the build.
      - name: pnpm audit --prod --audit-level high
        run: pnpm audit --prod --audit-level high

  # ── Trivy filesystem scan (vulns + secrets + misconfig) — task §3 ─────────────────────
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy fs (table output for the log)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1' # High/Critical fail the job and block merge
          ignore-unfixed: true

      - name: Trivy fs (SARIF for the Security tab)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy fs SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ── Trivy image scan (build the API container, then scan) — task §3 ───────────────────
  trivy-image:
    name: Trivy image scan (cairn-api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/server/Dockerfile -t cairn-api:ci .

      - name: Trivy image (table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: cairn-api:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy image (SARIF)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: cairn-api:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ── OWASP ZAP baseline DAST against the staging API — task §6 ─────────────────────────
  # Runs only when STAGING_API_URL is configured (repo variable). Until a staging API is
  # deployed the job is skipped, not silently passed — see threat-model §8 O4.
  zap-baseline:
    name: ZAP baseline (staging API)
    runs-on: ubuntu-latest
    if: ${{ vars.STAGING_API_URL != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ vars.STAGING_API_URL }}
          # Fail the job on WARN+ findings; tune false-positives via .zap/rules.tsv.
          cmd_options: '-a -I'
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
