<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cairn</title>
    <!--
      No-flicker theme script: runs synchronously before first paint. Reads the
      Zustand-persisted preference from localStorage and applies data-theme to <html>
      before React hydrates. Inline on purpose; the CSP plugin (electron.vite.config.ts)
      hashes this exact script into `script-src` at build time, so a strict CSP allows
      it with no 'unsafe-inline'. If blocked it degrades to a one-frame flash.
    -->
    <script>
      ;(function () {
        // Nvexis "The Almanac": Day (parchment) is the hero and the default.
        // Night (ink) is a true mode, chosen explicitly or via system pref.
        var theme = 'light'
        try {
          var raw = localStorage.getItem('cairn-ui')
          if (raw) {
            var pref = JSON.parse(raw).state.themePreference
            if (pref === 'dark') {
              theme = 'dark'
            } else if (pref === 'light') {
              theme = 'light'
            } else if (pref === 'system') {
              theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
            }
          }
        } catch (_) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
