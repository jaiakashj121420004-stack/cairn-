appId: com.jaiakash.cairn
productName: Cairn
copyright: Copyright © 2025 Jai Akash

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  - "!**/.{git,svn}"
  - "!**/node_modules/.cache"

asar: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.finance
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch:
        - x64

linux:
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

dmg:
  writeUpdateInfo: false
